name: EnzChemRED Bioformer linked-task validation

on:
  push:
    branches:
      - experiment/enzchemred-unified-q1-20260831
    paths:
      - '.github/workflows/enzchemred_bioformer.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DISABLE_XET: '1'
  TRANSFORMERS_NO_TORCHVISION: '1'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  MODEL_NAME: bioformers/bioformer-8L

jobs:
  bioformer_ner:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/enzchemred-unified-q1-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install training stack
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 transformers==4.44.2 tokenizers==0.19.1 click==8.1.8 spacy==3.8.7
      - name: Prepare common corpus and expose five trainable Bioformer layers
        run: |
          python enzchemred_q1/prepare_data.py
          sed -i 's/freeze_lower_bert(model,6)/freeze_lower_bert(model,3)/g' enzchemred_q1/train_transformer.py
      - name: Train and test Bioformer NER
        env:
          DATA_DIR: enzchemred_q1/prepared
          OUTPUT_DIR: enzchemred_q1/results/bioformer_ner
        run: |
          mkdir -p enzchemred_q1/results/bioformer_ner
          set -o pipefail
          python enzchemred_q1/train_transformer.py ner 2>&1 | tee enzchemred_q1/results/bioformer_ner/job.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enzchemred-bioformer-ner
          retention-days: 14
          if-no-files-found: warn
          path: enzchemred_q1/results/bioformer_ner/

  bioformer_re:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/enzchemred-unified-q1-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install training stack
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 transformers==4.44.2 tokenizers==0.19.1 click==8.1.8 spacy==3.8.7
      - name: Prepare common corpus and expose five trainable Bioformer layers
        run: |
          python enzchemred_q1/prepare_data.py
          sed -i 's/freeze_lower_bert(model,6)/freeze_lower_bert(model,3)/g' enzchemred_q1/train_transformer.py
      - name: Train and test Bioformer entity-marker RE
        env:
          DATA_DIR: enzchemred_q1/prepared
          OUTPUT_DIR: enzchemred_q1/results/bioformer_re
        run: |
          mkdir -p enzchemred_q1/results/bioformer_re
          set -o pipefail
          python enzchemred_q1/train_transformer.py re 2>&1 | tee enzchemred_q1/results/bioformer_re/job.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enzchemred-bioformer-re
          retention-days: 14
          if-no-files-found: warn
          path: enzchemred_q1/results/bioformer_re/
