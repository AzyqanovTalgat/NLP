name: EnzChemRED unified Q1 prepare

on:
  push:
    branches:
      - experiment/enzchemred-unified-q1-20260831
    paths:
      - 'enzchemred_q1/prepare_data.py'
      - '.github/workflows/enzchemred_prepare.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/enzchemred-unified-q1-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preprocessing dependencies
        run: python -m pip install numpy==1.26.4 scikit-learn==1.5.2 click==8.1.8 spacy==3.8.7
      - name: Prepare full corpus and common document splits
        run: |
          mkdir -p enzchemred_q1/prepared
          set -o pipefail
          python enzchemred_q1/prepare_data.py 2>&1 | tee enzchemred_q1/prepared/prepare.log
      - name: Upload prepared corpus
        uses: actions/upload-artifact@v4
        with:
          name: enzchemred-prepared
          retention-days: 14
          if-no-files-found: error
          path: enzchemred_q1/prepared/
      - name: Commit compact audit and splits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enzchemred_q1/prepared/audit.json enzchemred_q1/prepared/splits.json enzchemred_q1/prepared/prepare.log
          git diff --cached --quiet || git commit -m 'Add EnzChemRED prepared split audit [skip ci]'
          git push origin HEAD:experiment/enzchemred-unified-q1-20260831
