name: EnzChemRED unified two-article full benchmark

on:
  push:
    branches:
      - experiment/enzchemred-unified-q1-20260831
    paths:
      - 'enzchemred_q1/common_benchmark.py'
      - 'enzchemred_q1/run_classical.py'
      - 'enzchemred_q1/run_deep.py'
      - 'enzchemred_q1/run_transformer.py'
      - 'enzchemred_q1/run_transformer_entry.py'
      - 'enzchemred_q1/aggregate_benchmark.py'
      - '.github/workflows/enzchemred_full_benchmark.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: enzchemred-unified-full-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  PYTHONHASHSEED: '42'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DISABLE_XET: '1'
  TRANSFORMERS_NO_TORCHVISION: '1'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  ENZCHEMRED_DATA: ${{ github.workspace }}/enzchemred_q1/data
  ENZCHEMRED_RESULTS: ${{ github.workspace }}/enzchemred_q1/results

jobs:
  classical:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/enzchemred-unified-q1-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download immutable prepared dataset
        uses: actions/download-artifact@v4
        with:
          name: enzchemred-prepared
          path: enzchemred_q1/data
          repository: AzyqanovTalgat/NLP
          run-id: 33418665875
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install classical dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 joblib==1.4.2
      - name: Compile classical benchmark
        run: python -m py_compile enzchemred_q1/common_benchmark.py enzchemred_q1/run_classical.py
      - name: Train three baselines for both tasks
        run: |
          mkdir -p enzchemred_q1/results/classical
          set -o pipefail
          python enzchemred_q1/run_classical.py 2>&1 | tee enzchemred_q1/results/classical/job.log
      - name: Upload classical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enzchemred-classical
          retention-days: 14
          if-no-files-found: warn
          path: |
            enzchemred_q1/results/classical/*.csv
            enzchemred_q1/results/classical/*.json
            enzchemred_q1/results/classical/*.json.gz
            enzchemred_q1/results/classical/job.log

  deep_ner:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/enzchemred-unified-q1-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download immutable prepared dataset
        uses: actions/download-artifact@v4
        with:
          name: enzchemred-prepared
          path: enzchemred_q1/data
          repository: AzyqanovTalgat/NLP
          run-id: 33418665875
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install CPU PyTorch and deep dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 pytorch-crf==0.7.2
      - name: Compile deep NER benchmark
        run: python -m py_compile enzchemred_q1/common_benchmark.py enzchemred_q1/run_deep.py
      - name: Train CharCNN-BiLSTM-CRF
        run: |
          mkdir -p enzchemred_q1/results
          set -o pipefail
          python enzchemred_q1/run_deep.py --task ner 2>&1 | tee enzchemred_q1/results/deep_ner_job.log
      - name: Upload deep NER evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enzchemred-deep-ner
          retention-days: 14
          if-no-files-found: warn
          path: |
            enzchemred_q1/results/deep_ner_results.csv
            enzchemred_q1/results/deep_ner_predictions.json.gz
            enzchemred_q1/results/deep_ner_history.json
            enzchemred_q1/results/deep_ner_complete.json
            enzchemred_q1/results/deep_ner_job.log

  deep_re:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/enzchemred-unified-q1-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download immutable prepared dataset
        uses: actions/download-artifact@v4
        with:
          name: enzchemred-prepared
          path: enzchemred_q1/data
          repository: AzyqanovTalgat/NLP
          run-id: 33418665875
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install CPU PyTorch and deep dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 pytorch-crf==0.7.2
      - name: Compile deep RE benchmark
        run: python -m py_compile enzchemred_q1/common_benchmark.py enzchemred_q1/run_deep.py
      - name: Train marker BiLSTM-Attention
        run: |
          mkdir -p enzchemred_q1/results
          set -o pipefail
          python enzchemred_q1/run_deep.py --task re 2>&1 | tee enzchemred_q1/results/deep_re_job.log
      - name: Upload deep RE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enzchemred-deep-re
          retention-days: 14
          if-no-files-found: warn
          path: |
            enzchemred_q1/results/deep_re_results.csv
            enzchemred_q1/results/deep_re_predictions.json.gz
            enzchemred_q1/results/deep_re_history.json
            enzchemred_q1/results/deep_re_complete.json
            enzchemred_q1/results/deep_re_job.log

  transformer_ner:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/enzchemred-unified-q1-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download immutable prepared dataset
        uses: actions/download-artifact@v4
        with:
          name: enzchemred-prepared
          path: enzchemred_q1/data
          repository: AzyqanovTalgat/NLP
          run-id: 33418665875
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install CPU PyTorch and Transformer dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 transformers==4.44.2 tokenizers==0.19.1 safetensors==0.4.5
      - name: Compile Transformer NER benchmark
        run: python -m py_compile enzchemred_q1/common_benchmark.py enzchemred_q1/run_transformer.py enzchemred_q1/run_transformer_entry.py
      - name: Fine-tune PubMedBERT for Chemical/Protein NER
        run: |
          mkdir -p enzchemred_q1/results
          set -o pipefail
          python enzchemred_q1/run_transformer_entry.py --task ner 2>&1 | tee enzchemred_q1/results/transformer_ner_job.log
      - name: Upload Transformer NER evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enzchemred-transformer-ner
          retention-days: 14
          if-no-files-found: warn
          path: |
            enzchemred_q1/results/transformer_ner_results.csv
            enzchemred_q1/results/transformer_ner_predictions.json.gz
            enzchemred_q1/results/transformer_ner_history.json
            enzchemred_q1/results/transformer_ner_complete.json
            enzchemred_q1/results/transformer_ner_job.log

  transformer_re:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/enzchemred-unified-q1-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download immutable prepared dataset
        uses: actions/download-artifact@v4
        with:
          name: enzchemred-prepared
          path: enzchemred_q1/data
          repository: AzyqanovTalgat/NLP
          run-id: 33418665875
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install CPU PyTorch and Transformer dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 transformers==4.44.2 tokenizers==0.19.1 safetensors==0.4.5
      - name: Compile Transformer RE benchmark
        run: python -m py_compile enzchemred_q1/common_benchmark.py enzchemred_q1/run_transformer.py enzchemred_q1/run_transformer_entry.py
      - name: Fine-tune BioREx/PubMedBERT for conversion relations
        run: |
          mkdir -p enzchemred_q1/results
          set -o pipefail
          python enzchemred_q1/run_transformer_entry.py --task re 2>&1 | tee enzchemred_q1/results/transformer_re_job.log
      - name: Upload Transformer RE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enzchemred-transformer-re
          retention-days: 14
          if-no-files-found: warn
          path: |
            enzchemred_q1/results/transformer_re_results.csv
            enzchemred_q1/results/transformer_re_predictions.json.gz
            enzchemred_q1/results/transformer_re_history.json
            enzchemred_q1/results/transformer_re_complete.json
            enzchemred_q1/results/transformer_re_job.log

  aggregate:
    needs: [classical, deep_ner, deep_re, transformer_ner, transformer_re]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/enzchemred-unified-q1-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download immutable prepared dataset
        uses: actions/download-artifact@v4
        with:
          name: enzchemred-prepared
          path: enzchemred_q1/data
          repository: AzyqanovTalgat/NLP
          run-id: 33418665875
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: enzchemred-classical
          path: enzchemred_q1/incoming/classical
      - uses: actions/download-artifact@v4
        with:
          name: enzchemred-deep-ner
          path: enzchemred_q1/incoming/deep_ner
      - uses: actions/download-artifact@v4
        with:
          name: enzchemred-deep-re
          path: enzchemred_q1/incoming/deep_re
      - uses: actions/download-artifact@v4
        with:
          name: enzchemred-transformer-ner
          path: enzchemred_q1/incoming/transformer_ner
      - uses: actions/download-artifact@v4
        with:
          name: enzchemred-transformer-re
          path: enzchemred_q1/incoming/transformer_re
      - name: Install aggregation dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 matplotlib==3.9.2 tabulate==0.9.0
      - name: Aggregate metrics and evaluate sequential pipeline
        run: |
          mkdir -p enzchemred_q1/results/final
          set -o pipefail
          python enzchemred_q1/aggregate_benchmark.py 2>&1 | tee enzchemred_q1/results/final/aggregate.log
      - name: Commit compact final evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin experiment/enzchemred-unified-q1-20260831
          git add enzchemred_q1/results/final
          git diff --cached --quiet || git commit -m 'Add unified EnzChemRED benchmark results [skip ci]'
          git push origin HEAD:experiment/enzchemred-unified-q1-20260831
      - name: Upload final benchmark
        uses: actions/upload-artifact@v4
        with:
          name: enzchemred-unified-final
          retention-days: 30
          if-no-files-found: error
          path: enzchemred_q1/results/final/
