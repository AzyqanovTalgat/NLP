name: Scientific NER optimized full corpus

on:
  push:
    branches:
      - scientific-ie-ner-optimized-20260830
    paths:
      - .github/workflows/scientific_ie_ner_optimized.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scientific-ie-ner-optimized-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ner_optimized:
    name: Optimized biomedical NER — 5 models
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONHASHSEED: "20260830"
    steps:
      - name: Checkout fallback branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore, optimize, and verify NER source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          parts = sorted(Path("benchmarks/ner_parts").glob("part*"))
          if len(parts) != 8:
              raise SystemExit(f"Expected 8 NER source chunks, found {len(parts)}")
          encoded = "".join(part.read_text() for part in parts)
          encoded_digest = hashlib.sha256(encoded.encode()).hexdigest()
          expected_encoded = "53af1e8078fe6f3b99614cf437ab74daf5865d063c8dcdae253fb8fc3207839c"
          if encoded_digest != expected_encoded:
              raise SystemExit(f"NER encoded source hash mismatch: {encoded_digest}")
          target = Path("benchmarks/ner_benchmark_optimized.py")
          target.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          expected = "dcd57e54fbb127fd166898277d4ba99c8ce66268029fb17477bf99b9a9955fa0"
          if digest != expected:
              raise SystemExit(f"NER source hash mismatch: {digest}")

          source = target.read_text(encoding="utf-8")
          replacements = {
              'configs = ((0.05, 0.05), (0.1, 0.05), (0.1, 0.1))': 'configs = ((0.1, 0.1),)',
              'max_iterations=120': 'max_iterations=70',
              'patience = 3': 'patience = 2',
              'for epoch in range(1, 16):': 'for epoch in range(1, 11):',
              'num_train_epochs=3': 'num_train_epochs=2',
              'max_length=256': 'max_length=192',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise RuntimeError(f"Expected NER source fragment not found: {old}")
              source = source.replace(old, new)
          target.write_text(source, encoding="utf-8")
          print(f"Optimized NER source created from verified digest: {digest}")
          PY
          python -m py_compile benchmarks/ner_benchmark_optimized.py

      - name: Install pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install \
            numpy==1.26.4 \
            pandas==2.2.3 \
            pyarrow==18.1.0 \
            scikit-learn==1.5.2 \
            sklearn-crfsuite==0.5.0 \
            requests==2.32.3 \
            transformers==4.46.3 \
            accelerate==1.1.1 \
            safetensors==0.4.5

      - name: Run optimized full-corpus NER benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/ner_optimized
          set -o pipefail
          python benchmarks/ner_benchmark_optimized.py \
            --output results/ner_optimized \
            --bootstrap 300 2>&1 | tee results/ner_optimized/run.log

      - name: Upload optimized NER evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ner-optimized-results
          path: |
            results/ner_optimized/*.csv
            results/ner_optimized/*.json
            results/ner_optimized/run.log
            results/ner_optimized/predictions
          if-no-files-found: warn
          retention-days: 14
