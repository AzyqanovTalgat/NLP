name: EnzChemRED BiomedBERT-small relation benchmark

on:
  push:
    branches:
      - experiment/enzchemred-unified-q1-20260831
    paths:
      - 'enzchemred_q1/run_tiny_re.py'
      - '.github/workflows/enzchemred_small_re.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DISABLE_XET: '1'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  ENZCHEMRED_DATA: enzchemred_q1/prepared

jobs:
  small_re:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/enzchemred-unified-q1-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU stack
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 sklearn-crfsuite==0.5.0 transformers==4.44.2 safetensors==0.4.5
      - name: Download common prepared corpus
        uses: actions/download-artifact@v4
        with:
          name: enzchemred-prepared
          path: enzchemred_q1/prepared
          run-id: 33418665875
          github-token: ${{ github.token }}
      - name: Train BiomedBERT-small on every training relation instance
        run: |
          mkdir -p enzchemred_q1/results_small_re
          set -o pipefail
          python enzchemred_q1/run_tiny_re.py --model-name neuml/biomedbert-small --epochs 8 --data-dir enzchemred_q1/prepared --out-dir enzchemred_q1/results_small_re 2>&1 | tee enzchemred_q1/results_small_re/job.log
      - name: Upload complete relation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enzchemred-small-transformer-re
          retention-days: 14
          if-no-files-found: warn
          path: enzchemred_q1/results_small_re/
