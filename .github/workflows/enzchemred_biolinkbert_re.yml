name: EnzChemRED BioLinkBERT relation validation

on:
  push:
    branches:
      - experiment/enzchemred-unified-q1-20260831
    paths:
      - '.github/workflows/enzchemred_biolinkbert_re.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DISABLE_XET: '1'
  TRANSFORMERS_NO_TORCHVISION: '1'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  MODEL_NAME: michiyasunaga/BioLinkBERT-base

jobs:
  biolinkbert_re:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/enzchemred-unified-q1-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training stack
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 transformers==4.44.2 tokenizers==0.19.1 click==8.1.8 spacy==3.8.7
      - name: Prepare common EnzChemRED splits
        run: python enzchemred_q1/prepare_data.py
      - name: Fine-tune and test BioLinkBERT relation classifier
        env:
          DATA_DIR: enzchemred_q1/prepared
          OUTPUT_DIR: enzchemred_q1/results/biolinkbert_re
        run: |
          mkdir -p enzchemred_q1/results/biolinkbert_re
          set -o pipefail
          python enzchemred_q1/train_transformer.py re 2>&1 | tee enzchemred_q1/results/biolinkbert_re/job.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enzchemred-biolinkbert-re
          retention-days: 14
          if-no-files-found: warn
          path: enzchemred_q1/results/biolinkbert_re/
