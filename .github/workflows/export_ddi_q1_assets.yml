name: Export DDI Q1 assets

on:
  push:
    branches:
      - experiment/ddi-q1-unified-20260901
    paths:
      - '.github/workflows/export_ddi_q1_assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: experiment/ddi-q1-unified-20260901

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install download tooling
        run: python -m pip install --upgrade huggingface_hub

      - name: Download official DDI corpus and biomedical encoders
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          set -euxo pipefail
          mkdir -p exported_assets/corpus exported_assets/models
          curl -L --retry 5 --fail \
            https://raw.githubusercontent.com/isegura/DDICorpus/master/DDICorpus-2013.zip \
            -o exported_assets/corpus/DDICorpus-2013.zip
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='nlpie/tiny-biobert',
              local_dir='exported_assets/models/tiny-biobert',
              allow_patterns=['config.json','pytorch_model.bin','tokenizer.json','tokenizer_config.json','special_tokens_map.json','vocab.txt'],
          )
          snapshot_download(
              repo_id='NeuML/biomedbert-small',
              local_dir='exported_assets/models/biomedbert-small',
              allow_patterns=['config.json','model.safetensors','pytorch_model.bin','tokenizer.json','tokenizer_config.json','special_tokens_map.json','vocab.txt'],
          )
          PY
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('exported_assets')
          rows = []
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  h = hashlib.sha256(path.read_bytes()).hexdigest()
                  rows.append({'path': str(path.relative_to(root)), 'bytes': path.stat().st_size, 'sha256': h})
          (root / 'asset_manifest.json').write_text(json.dumps(rows, indent=2), encoding='utf-8')
          print(json.dumps(rows, indent=2))
          PY

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: ddi-q1-assets
          path: exported_assets/
          retention-days: 14
          if-no-files-found: error
